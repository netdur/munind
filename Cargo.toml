[package]
name = "munind"
version = "0.1.0"
edition = "2024"
description = "Fast approximate nearest neighbor search library"
license = "Apache-2.0"
keywords = ["ann", "nearest-neighbor", "vector-search", "similarity"]
categories = ["algorithms", "science"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rand = "0.8"
rayon = "1.7"
clap = { version = "4.2", features = ["derive"] }
memmap2 = "0.9"
thiserror = "2.0.18"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"

