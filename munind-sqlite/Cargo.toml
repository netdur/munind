[package]
name = "munind-sqlite"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
name = "munind"

[[bin]]
name = "bench"
path = "src/bench.rs"

[dependencies]
munind-core = { path = "../munind-core" }
rusqlite = { version = "0.33", features = ["vtab", "loadable_extension", "functions"] }
serde_json = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
rayon = "1.7"
